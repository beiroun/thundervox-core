# ThunderVox - SIP core v0.12 (several devices per number, parallel forking, wake window)
# ======================================================================================
# A thin Kamailio proxy + registrar for physical SIP endpoints (intercoms,
# elevators, gates, SOS points) calling mobile apps. Media is relayed by
# rtpengine, one session per branch. With TVX_PROVISIONING the accounts come
# from the provisioning server's PostgreSQL (auth_db) and registrations are
# kept there too (usrloc write-through); without it the core is open and keeps
# everything in memory.
#
# What this core covers (every branch is logged with a [TVX] line):
#   REGISTER      several contacts per AoR (the owner's phone, the family's
#                 phones, a watch), NAT-safe (received), keepalive pings for
#                 NATed contacts, unregister. A contact whose TCP connection
#                 dies is dropped at once (usrloc handle_lost_tcp): "online"
#                 means reachable.
#   INVITE        callee online  -> parallel fork to every contact, one
#                 rtpengine session per branch (audio + video); the first
#                 200 OK wins and tm cancels the other devices
#                 callee offline -> 480 (default) or, for app clients with
#                 TVX_PUSH_WAIT, park + push
#   push-first    app clients (numbers 1...) with TVX_PUSH_WAIT are ALWAYS
#                 parked and woken, whatever location says about them: a
#                 registration an app left behind says nothing about the phone
#                 being awake. Only the devices that register after the push
#                 are rung.
#   wake window   a parked call stays open TVX_WAKE_WINDOW seconds: the decline
#                 of one device (iOS answers 603 when it restarts its SIP stack
#                 mid-ring), a dead branch or a slow phone do not end it - only
#                 an answer, the caller's CANCEL or the window itself do
#   CANCEL        before answer: cancel the branches, release media, 487 to
#                 caller; a parked INVITE is cancelled the same way
#   BYE           from either side: release media, relay
#   re-INVITE     hold / resume / codec change: re-offer + re-answer
#   ACK           2xx ACK (plain or late-offer with SDP), negative-reply ACK
#   UPDATE        early-media SDP update
#   INFO/NOTIFY   relayed inside the dialog untouched (SIP INFO DTMF = door open)
#   OPTIONS       answered 200 (device keepalives / availability probes)
#   failures      408/480/486/603/etc. and timeouts release media
#   call events   started / answered / ended go to the provisioning server
#                 (its call log and dashboard) whenever TVX_CORE_TOKEN is set
#   transport     UDP and TCP on 5060, SIPS on 5061 with TVX_TLS; every
#                 socket advertises the same public address
#   identity      never the From header: intercom firmwares put the apartment
#                 number there. With TVX_PROVISIONING the caller is the
#                 authenticated username (digest auth on REGISTER and INVITE, a
#                 number registers only itself); without it, the device
#                 registered from the source socket (ip:port -> AoR, htable).
#                 An INVITE from a source that is not registered gets 403.
#   hygiene       scanner User-Agents dropped, optional flood guard (pike),
#                 retransmissions re-answered
#
# Deliberate limits (see README "Known limitations"):
#   - one parked call per callee at a time: a second INVITE to a number whose
#     call is still waking up gets 486
#   - the wake request and the call events are synchronous HTTP (loopback,
#     answered by the server before any network work)
#   - dialogs live in memory only; registrations too unless TVX_PROVISIONING
#   - the rtpengine branch sessions of the losing devices live until the call
#     ends (the final delete drops the whole call)
#
# NAT strategy (proven pattern): "received" for registered devices
# (fix_nated_register + received_avp) and "alias" for the other in-dialog party
# (set_contact_alias / handle_ruri_alias). RTP is always anchored on rtpengine,
# so the two UAs never need a direct path.


####### Site-local values and switches (kept OUT of this repository) #######
# Public IP, the server's token and the feature switches are deployment-specific
# and live in local.cfg next to this file (template: deploy/local.cfg.example in
# the umbrella repository, next to the live file); the push gateway itself is
# configured on the console's Integration page, not here.
# include_file is a preprocessor directive: substdef/define from local.cfg are in
# effect for the whole config below, exactly as if written here.
#   TVX_SIP_DOMAIN  - the DNS name devices register to and dial through. When
#                     set, the core works through it: advertised in Via/
#                     Record-Route and treated as "myself" (decision 2026-10-01).
#   TVX_PUBLIC_IP   - server public IP. Used for advertise when TVX_SIP_DOMAIN is
#                     absent, otherwise only aliased as a fallback for raw-IP
#                     devices. Keep it equal to TVX_PUBLIC_IP in the deployment .env (thundervox/deploy).
#                     At least one of TVX_SIP_DOMAIN / TVX_PUBLIC_IP must be set.
#   TVX_CORE_TOKEN  - X-CORE-TOKEN the server expects on /internal/** (the same
#                     value as TVX_CORE_TOKEN in the deployment .env). When set,
#                     the core reports call events to the server; TVX_PUSH_WAIT
#                     requires it.
#   TVX_SERVER_URL  - base URL of the provisioning server's API; defaults to
#                     http://127.0.0.1:8080/api/v1 and is only overridden when
#                     the server listens elsewhere
#   TVX_DB_URL      - postgres://tvx_sip:<password>@127.0.0.1:5432/thundervox,
#                     the provisioning database (only used with TVX_PROVISIONING)
# Switches (#!define NAME in local.cfg to enable, all OFF when absent):
#   TVX_PROVISIONING - digest auth of REGISTER and INVITE against the
#                     subscriber table the provisioning server keeps (HA1 only,
#                     realm = TVX_SIP_DOMAIN), registrations written through to
#                     PostgreSQL (they survive a restart, the console sees them).
#                     Requires TVX_SIP_DOMAIN and TVX_DB_URL. Without it the core
#                     is OPEN - anyone may register any number.
#   TVX_PUSH_WAIT   - app clients are push-first: their INVITEs are parked and
#                     the provisioning server is asked to wake the phones (it
#                     delivers the push to the operator's backend); without it
#                     an offline callee gets 480 at once and a registered one
#                     is simply rung. Requires TVX_CORE_TOKEN.
#   TVX_ANTIFLOOD   - pike request-rate guard per source IP
#   TVX_TLS         - accept SIPS on 5061 as well; the certificate and the key
#                     are named in /etc/kamailio/tls.cfg (mounted next to
#                     local.cfg, template deploy/tls.cfg.example in the umbrella
#                     repository). Plain 5060 stays open - devices that cannot
#                     do TLS keep working.
include_file "/etc/kamailio/local.cfg"

# Fail fast with a readable token in the parser error when local.cfg defines
# neither the SIP domain nor the public IP.
#!ifndef TVX_SIP_DOMAIN
#!ifndef TVX_PUBLIC_IP
NEITHER_TVX_SIP_DOMAIN_NOR_TVX_PUBLIC_IP_IS_DEFINED_IN_LOCAL_CFG
#!endif
#!endif

# TVX_PROVISIONING needs the realm the passwords were hashed with (the SIP
# domain - an IP would never match the server's HA1) and the database to read.
#!ifdef TVX_PROVISIONING
#!ifndef TVX_SIP_DOMAIN
TVX_PROVISIONING_NEEDS_TVX_SIP_DOMAIN_IT_IS_THE_DIGEST_REALM
#!endif
#!ifndef TVX_DB_URL
TVX_PROVISIONING_NEEDS_TVX_DB_URL_IN_LOCAL_CFG
#!endif
#!endif

# The link to the provisioning server (wake requests, call events) exists
# whenever local.cfg carries the server's token; unless local.cfg says
# otherwise, the server is found on loopback. TVX_PUSH_WAIT needs the link.
#!ifdef TVX_CORE_TOKEN
#!define TVX_SERVER_LINK
#!ifndef TVX_SERVER_URL
#!define TVX_SERVER_URL "http://127.0.0.1:8080/api/v1"
#!endif
#!endif
#!ifdef TVX_PUSH_WAIT
#!ifndef TVX_CORE_TOKEN
TVX_PUSH_WAIT_NEEDS_TVX_CORE_TOKEN_IN_LOCAL_CFG
#!endif
#!endif

# rtpengine ng control socket and per-leg media flags: plain RTP/AVP, ICE
# stripped, o= rewritten to the relay. (replace-session-connection was dropped:
# rtpengine 13.x accepts it silently and does nothing.)
# The branch set adds via-branch=auto-next: one rtpengine session per outgoing
# branch - the branch id tm generates for the request, the first Via of its
# replies - so a parallel fork keeps the answer of the winner apart from the
# early media of the losers. Inside an established dialog the plain set is
# used: from/to tags identify the call there.
#!define TVX_RTPENGINE_SOCK "udp:127.0.0.1:4444"
#!define TVX_RTP_FLAGS "replace-origin ICE=remove"
#!define TVX_RTP_BRANCH_FLAGS "replace-origin ICE=remove via-branch=auto-next"

# How long a parked call waits for a device to register, in seconds and in
# milliseconds (the caller rings all the while). tm's max_inv_lifetime below is
# the hard cap of any INVITE transaction.
#!define TVX_WAKE_WINDOW 90
#!define TVX_WAKE_WINDOW_MS 90000

# First digit of app client numbers (numbering plan of the provisioning server:
# 1... app clients, 2... intercom panels). Only these are push-first.
#!define TVX_CLIENT_PREFIX "1"

# Flags. Keep the #!define lines bare: the preprocessor takes the whole rest of
# the line as the value, so a trailing "# comment" gets pasted into every usage.
#   FLT_NATS - transaction flag: this request came from behind NAT
#   FLB_NATB - branch flag: contact is NATed (stored in usrloc, natping target)
#!define FLT_NATS 5
#!define FLB_NATB 6


####### Global Parameters #######

debug=2
log_stderror=yes
# every log line carries message type (1=request, 2=reply), CSeq and Call-ID,
# so one call can be followed through kamailio logs with a single grep
log_prefix="{$mt $hdr(CSeq) $ci} "

memdbg=5
memlog=5

children=4

server_header="Server: ThunderVox"
user_agent_header="User-Agent: ThunderVox"
sip_warning=0

# TLS support is a core switch that must precede the first tls: socket; the
# module itself is loaded further down (both are needed for SIPS).
#!ifdef TVX_TLS
enable_tls=yes
#!endif

# Bind on all interfaces, advertise one public address so replies/in-dialog
# requests come back to us even behind cloud 1:1 NAT. TCP is offered for
# devices that cannot do UDP; both sockets advertise the same address.
# The SIP domain wins when it is set; otherwise the public IP is advertised.
#!ifdef TVX_SIP_DOMAIN
listen=udp:0.0.0.0:5060 advertise TVX_SIP_DOMAIN:5060
listen=tcp:0.0.0.0:5060 advertise TVX_SIP_DOMAIN:5060
#!ifdef TVX_TLS
# A certificate is issued for a name, so SIPS is only advertised by name - never
# by raw IP, which no CA signs.
listen=tls:0.0.0.0:5061 advertise TVX_SIP_DOMAIN:5061
#!endif
#!else
listen=udp:0.0.0.0:5060 advertise TVX_PUBLIC_IP:5060
listen=tcp:0.0.0.0:5060 advertise TVX_PUBLIC_IP:5060
#!ifdef TVX_TLS
TVX_TLS_NEEDS_TVX_SIP_DOMAIN_A_CERTIFICATE_IS_ISSUED_FOR_A_NAME_NOT_AN_IP
#!endif
#!endif
# some embedded stacks omit Content-Length on TCP; accept instead of dropping
tcp_accept_no_cl=yes

# TCP liveness. Apps register over TCP from behind NAT and never unregister;
# the only honest sign that a phone is gone is its connection dying. Keepalive
# probes find a dead peer (phone suspended, NAT mapping gone) within about a
# minute, usrloc then drops the contact (handle_lost_tcp). An alive but idle
# connection is kept as long as the longest registration, so an app that stays
# up stays registered. Connect/send timeouts are short so a dead destination
# fails a branch in seconds, not in the default ten.
tcp_keepalive=yes
tcp_keepidle=30
tcp_keepintvl=10
tcp_keepcnt=3
tcp_connection_lifetime=3605
tcp_connect_timeout=5
tcp_send_timeout=5

# What counts as "us" for uri==myself: the SIP domain when set, the raw public
# IP whenever it is set (fallback for devices that dial by IP).
#!ifdef TVX_SIP_DOMAIN
alias=TVX_SIP_DOMAIN:5060
#!ifdef TVX_TLS
alias=TVX_SIP_DOMAIN:5061
#!endif
#!endif
#!ifdef TVX_PUBLIC_IP
alias=TVX_PUBLIC_IP:5060
#!endif


