####### Module Parameters #######

# --- tm: transaction timers and forking ---
# fr_timer: no reply at all (e.g. NATed contact whose pinhole died) -> 408.
# fr_inv_timer: ringing without final answer -> 408. max_inv_lifetime: the hard
# cap of any INVITE transaction, a parked (push-wait) one included - whatever
# the timers of its branches say, it is over after this. All in milliseconds.
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("tm", "max_inv_lifetime", 120000)
# A 6xx from one device is just that device's answer (iOS sends 603 when it
# restarts its SIP stack mid-ring, a family member may decline): the other
# branches keep ringing and the wake window stays open. RFC 3261 would stop
# the whole fork on a 6xx - that is exactly the wrong behaviour here.
modparam("tm", "disable_6xx_block", 1)

# --- registrar / usrloc: location ---
#!ifdef TVX_PROVISIONING
# Write-through: every REGISTER is in PostgreSQL before the 200 OK, so a
# restart reloads the registrations (db_load, on by default) and the server
# reads who is online from the same table (presence sampler, console). Slower
# than memory, irrelevant at this scale; the point of failure is the database -
# if it is down, REGISTER fails instead of silently living in memory only.
modparam("usrloc", "db_url", "TVX_DB_URL")
modparam("usrloc", "db_mode", 1)
#!else
modparam("usrloc", "db_mode", 0)
#!endif
modparam("usrloc", "use_domain", 0)                      # AoR = user part only (sip:101@IP and sip:101@host are the same user)
modparam("usrloc", "nat_bflag", FLB_NATB)                 # NATed contacts get pinged by nathelper
modparam("usrloc", "handle_lost_tcp", 1)                  # a TCP/TLS contact leaves location the moment its connection is lost
modparam("registrar", "method_filtering", 0)              # never hide a contact because of its Allow header (embedded stacks lie there)
modparam("registrar", "received_avp", "$avp(RECEIVED)")   # remember the real source socket of NATed UAs
modparam("registrar", "default_expires", 600)             # REGISTER without Expires
modparam("registrar", "min_expires", 60)                  # shorter values are raised silently (NAT pinhole is kept by natping anyway)
modparam("registrar", "max_expires", 3600)                # longer values are capped so a dead UDP device disappears within an hour

# --- htable: small in-memory maps the routes share ---
# tvxdev: device identity, source socket -> registered AoR. Written on REGISTER
# (key "ip:port", value = AoR username), read on INVITE to name the calling
# device. A device whose NAT mapping changed re-registers from the new socket
# and gets a new item; stale items expire with the longest allowed registration
# (max_expires) and a live registration is re-checked on every INVITE anyway, so
# a stale item can never let an unregistered source call.
modparam("htable", "htable", "tvxdev=>size=12;autoexpire=3600;")
# tvxpark: parked calls waiting for a device, callee number -> "tindex:tlabel"
# of the suspended INVITE transaction. autoexpire is a safety net above the
# wake window: every way out of the window clears the item itself.
modparam("htable", "htable", "tvxpark=>size=10;autoexpire=180;")
# tvxmedia: calls that have an rtpengine session, Call-ID -> 1. Teardown talks
# to the relay only when there is something to delete (a parked call that was
# cancelled before any device rang has no session).
modparam("htable", "htable", "tvxmedia=>size=12;autoexpire=14400;")

# --- nathelper: NAT keepalive + received handling ---
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "natping_interval", 30)             # keep the NAT pinhole open every 30s (4-byte UDP, invisible in sngrep)
modparam("nathelper", "ping_nated_only", 1)

# --- rtpengine: media relay ---
modparam("rtpengine", "rtpengine_sock", TVX_RTPENGINE_SOCK)

# --- dialog: call state for observability only (kamcmd dlg.list / dlg.stats_active) ---
modparam("dialog", "db_mode", 0)
modparam("dialog", "enable_stats", 1)

# --- ctl: kamcmd socket (ul.dump, dlg.list, tm.stats, rtpengine.show all) ---
modparam("ctl", "binrpc", "unix:/tmp/kamailio_ctl")

#!ifdef TVX_PROVISIONING
# --- auth_db: accounts of the provisioning server ---
# The server stores only HA1 = md5(user:realm:password) (and ha1b for UAs that
# send user@domain as the username), never the password: calculate_ha1=0.
# use_domain=0: numbers are unique without a domain, same rule as usrloc.
modparam("auth_db", "db_url", "TVX_DB_URL")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "password_column_2", "ha1b")
modparam("auth_db", "use_domain", 0)
#!endif

#!ifdef TVX_SERVER_LINK
# --- http_client: wake requests and call events to the provisioning server (loopback) ---
modparam("http_client", "connection_timeout", 2)          # bound every blocking request to the server (see route[PUSH], route[CALL_EVENT])
#!endif

#!ifdef TVX_ANTIFLOOD
# --- pike: more than 32 requests per 2s from one IP -> dropped for 4 units ---
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 32)
modparam("pike", "remove_latency", 4)
#!endif

#!ifdef TVX_TLS
# --- tls: certificate and key come from an external file, never from a modparam ---
# Only the "config" file is reloadable at runtime (tls.reload): a renewed certificate is picked up without
# restarting the core, so the in-memory registrations survive the renewal.
modparam("tls", "config", "/etc/kamailio/tls.cfg")
#!endif


####### Main request routing #######

request_route {

    # sanity, hop limit, scanners, flood
    route(REQINIT);

    # NAT detection (force_rport + contact fixups) for every request
    route(NATDETECT);

    # OPTIONS to the server itself: device keepalive / "is the server alive"
    # probe. Answer 200 - a 405 here makes some UAs mark the server dead.
    if (is_method("OPTIONS") && !has_totag()) {
        sl_send_reply("200", "OK");
        exit;
    }

    # CANCEL: the caller gave up before the answer. Release media, cancel the
    # pending branches (tm answers 487 to the INVITE and 200 to the CANCEL). A
    # parked (push-wait) INVITE is cancelled the same way: tm fakes the 487 on
    # the blind branch that holds it, and the callee is free to be called again.
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            xlog("L_INFO", "[TVX] CANCEL $fU -> $rU from $si:$sp: releasing media\n");
            route(MEDIA_RELEASE);
#!ifdef TVX_PUSH_WAIT
            $sht(tvxpark=>$rU) = $null;
#!endif
            $var(reason) = "cancel";
            $var(code) = 487;
            route(CALL_ENDED);
            t_relay();
        } else {
            sl_send_reply("481", "Call/Transaction Does Not Exist");
        }
        exit;
    }

    # in-dialog (sequential) requests: ACK / BYE / re-INVITE / UPDATE / INFO
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # retransmission of an initial request already in tm -> tm re-sends the
    # last reply and stops here (e.g. INVITE repeated while we ring the callee)
    t_check_trans();

    # initial requests we serve
    if (is_method("REGISTER")) { route(AUTH); route(REGISTER); exit; }
    if (is_method("INVITE"))   { route(AUTH); route(INVITE);   exit; }

    # closed core: no other initial request is accepted (SUBSCRIBE, PUBLISH,
    # MESSAGE, out-of-dialog NOTIFY/INFO/REFER). Logged so nothing dies silently.
    xlog("L_WARN", "[TVX] unsupported initial $rm from $si:$sp ua=$ua -> 405\n");
    sl_send_reply("405", "Method Not Allowed");
    exit;
}


# Request sanity, loop protection, scanner and flood guard.
route[REQINIT] {
    # Known SIP scanners / fraud dialers: drop without any reply (a reply only
    # tells them a SIP server is here).
    if ($ua =~ "friendly-scanner|sipvicious|sipcli|VaxSIPUserAgent|sundayddr|pplsip") {
        xlog("L_WARN", "[TVX] scanner $ua from $si:$sp - dropped\n");
        exit;
    }

#!ifdef TVX_ANTIFLOOD
    # Request-rate guard per source IP. Note: one NAT with many devices behind
    # it counts as one IP - keep reqs_density_per_unit generous.
    if (!pike_check_req()) {
        xlog("L_WARN", "[TVX] flood from $si:$sp - dropped\n");
        exit;
    }
#!endif

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        # Data-loss point for exotic firmwares: a device whose requests fail
        # here never gets a reply. The dropped request should be captured with
        # sngrep and the check relaxed deliberately, not removed.
        xlog("L_WARN", "[TVX] malformed $rm from $si:$sp ua=$ua - dropped by sanity_check\n");
        exit;
    }
}


# Detect NAT and rewrite contacts so we can reach UAs behind NAT.
# Test 19 = 1 (Contact has a private IP) + 2 (Via differs from source IP)
#         + 16 (source port differs from Via port).
route[NATDETECT] {
    force_rport();
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            # rewrite the REGISTER Contact to the real source (kept via received_avp)
            fix_nated_register();
        } else if (is_first_hop()) {
            # encode the real source into an alias so in-dialog requests get back to the UA
            set_contact_alias();
        }
        setflag(FLT_NATS);
    }
}


# Authentication of REGISTER and INVITE.
#
# With TVX_PROVISIONING: digest auth against the subscriber table the server
# keeps (one row per enabled number; a blocked or deleted number has none, so it
# fails here at once). auth_check runs with flags 0 - it compares no From/To user
# itself, because intercom firmwares put the apartment number into From - and the
# identity rules are applied explicitly instead:
#   REGISTER  a number registers only itself (To-user == auth user); binding a
#             foreign AoR would hijack that number's calls -> 403
#   INVITE    the caller is the authenticated number, whatever From says
# A missing Authorization header is the normal first round (-> 401/407
# challenge, not logged); a wrong password or an unknown user is logged as a
# warning - a misconfigured device or somebody guessing.
#
# Without it the core is OPEN - anyone may register any number - acceptable only
# for a closed test; calls are still accepted only from registered sources.
route[AUTH] {
#!ifdef TVX_PROVISIONING
    if (!auth_check("TVX_SIP_DOMAIN", "subscriber", "0")) {
        $var(auth_rc) = $rc;
        if ($var(auth_rc) == -2 || $var(auth_rc) == -3) {
            xlog("L_WARN", "[TVX] $rm auth FAILED rc=$var(auth_rc) (-2 wrong password, -3 unknown user) user=$au to=$tU from $si:$sp ua=$ua\n");
        } else if ($var(auth_rc) == -1) {
            # Data-loss point: -1 includes "couldn't fetch from table" - a database
            # outage locks every device out; check the postgres container first
            xlog("L_ERR", "[TVX] $rm auth ERROR rc=-1 user=$au from $si:$sp - credentials unparsable or database unreachable\n");
        }
        auth_challenge("TVX_SIP_DOMAIN", "0");
        exit;
    }
    if (is_method("REGISTER") && $au != $tU) {
        xlog("L_WARN", "[TVX] REGISTER of $tU with the credentials of $au from $si:$sp ua=$ua - 403\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
    if (is_method("INVITE")) {
        $avp(caller) = $au;
    }
    # the credentials are ours: never forward them to the callee
    consume_credentials();
#!endif
    return;
}


# REGISTER: store the contact (several per AoR), then wake a parked call if
# this is a device that just came up.
route[REGISTER] {
    if (isflagset(FLT_NATS)) {
        setbflag(FLB_NATB);            # mark contact NATed so nathelper keeps its pinhole alive
    }

    # New device or a refresh? Decided before the save: a SIP stack refreshes
    # with the Call-ID of its first REGISTER, a stack that (re)starts comes with
    # a new one (iOS restarts its stack on every push, the second time with the
    # same Contact). Only a new binding wakes a parked call - a refresh would
    # send the ringing device a second INVITE of the same call.
    $var(refresh) = 0;
    if (registered("location", "$tu", 1)) {
        $var(refresh) = 1;
    }

    # Several contacts per AoR: the owner's phone, the family's phones, a watch.
    # A call to the number forks to all of them (route[INVITE], route[RESUME]).
    # Stale contacts are no longer a worry: a dead TCP connection drops its
    # contact at once (handle_lost_tcp), UDP contacts expire (max_expires).
    if (!save("location")) {
        xlog("L_WARN", "[TVX] REGISTER failed: aor=$tu src=$si:$sp rc=$rc\n");
        sl_reply_error();
        exit;
    }

    $var(dev) = $si + ":" + $sp;

    if ($rc == 3) {
        $sht(tvxdev=>$var(dev)) = $null;   # device left: drop its identity binding
        xlog("L_INFO", "[TVX] UNREGISTER ok: aor=$tu src=$si:$sp\n");
        exit;
    }

    # Identity binding for route[INVITE]: a device calls from the socket it
    # registers from (one SIP stack, one socket), so "ip:port" names the device.
    $sht(tvxdev=>$var(dev)) = $tU;

    if (isflagset(FLT_NATS)) { $var(nat) = "nat"; } else { $var(nat) = "direct"; }
    if ($var(refresh) == 1) { $var(binding) = "refresh"; } else { $var(binding) = "new"; }
    xlog("L_INFO", "[TVX] REGISTER ok ($var(binding)): aor=$tu contact=$ct expires=$hdr(Expires) src=$si:$sp proto=$pr $var(nat) ua=$ua\n");

#!ifdef TVX_PUSH_WAIT
    # A device of this number just came up. If a caller is waiting for it, the
    # parked INVITE is resumed and rung to every contact of the number.
    if ($var(refresh) == 0) {
        route(RESUME_PARKED);
    }
#!endif
    exit;
}


# INVITE: identify the caller, then either fork to the registered devices
# (through rtpengine, one session per branch) or park + push / 480.
route[INVITE] {
    # Record-Route so in-dialog ACK/BYE/re-INVITE traverse us (NAT + media teardown).
    record_route();

    # Attach the branch/reply/failure handling BEFORE any transaction is created,
    # so a parked transaction also runs these routes when it is resumed.
    t_on_branch("MANAGE_BRANCH");
    t_on_reply("MANAGE_REPLY");
    t_on_failure("MANAGE_FAILURE");

    # Who is calling: the device bound to the source socket on REGISTER (with
    # TVX_PROVISIONING route[AUTH] will have set the authenticated username). The From
    # header is never an identity - intercom firmwares put the apartment number
    # there (Beward: From-user = flat number while the account is 101) - so it
    # is only logged. A source that never registered is not a device of ours:
    # 403, which also ends the fraud probes that reach an open core.
    if ($avp(caller) == $null) {
        $var(dev) = $si + ":" + $sp;
        $avp(caller) = $sht(tvxdev=>$var(dev));
    }
    if ($avp(caller) == $null || !registered("location", "sip:$avp(caller)@$fd")) {
        xlog("L_WARN", "[TVX] INVITE from unregistered source $si:$sp (From-user $fU, ua=$ua) -> $rU: 403\n");
        sl_send_reply("403", "Caller Not Registered");
        exit;
    }

    # Users are matched by username only (usrloc use_domain=0), so a foreign
    # R-URI domain is never forwarded anywhere - it is just logged here. With
    # the domain and/or the IP aliased, this fires only for a misconfigured
    # device (wrong domain field) - the log line names it.
    if (!(uri==myself)) {
        xlog("L_WARN", "[TVX] INVITE to foreign domain $rd from $si:$sp ua=$ua - device domain field is wrong, looked up as local user $rU\n");
    }

    # Facts the branch, reply and failure routes need, kept in the transaction:
    # whom the call is for (the R-URI is rewritten by every lookup) and that this
    # is the initial INVITE (a re-INVITE is offered in route[WITHINDLG], not per
    # branch). Set before the transaction is created so they travel with it.
    $avp(callee) = $rU;
    $avp(initial) = 1;

#!ifdef TVX_PUSH_WAIT
    # App clients are push-first. A contact an app left in location says
    # nothing about the phone being awake (iOS keeps it until it expires, even
    # after a hang-up from the lock screen), and every app registers again when
    # the push arrives. So the call is parked and only the devices that register
    # from now on are rung - no 30 s of silence on a dead contact. One parked
    # call per number: a second caller while the phones wake up hears busy.
    if ($(rU{s.substr,0,1}) == TVX_CLIENT_PREFIX) {
        if ($sht(tvxpark=>$rU) != $null) {
            xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $rU (From-user $fU): a call to this number is already waking it up -> 486\n");
            sl_send_reply("486", "Busy Here");
            exit;
        }
        route(PARK_AND_PUSH);
        exit;
    }
#!endif

    if (!lookup("location")) {
        # Callee not registered (or lookup error: rc -3).
        if ($rc == -3) {
            xlog("L_ERR", "[TVX] INVITE $avp(caller) -> $rU: lookup internal error\n");
            sl_send_reply("500", "Server Error");
            exit;
        }
        # Not an app client (or push-wait off): nobody to wake, nothing to wait for.
        xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $rU (From-user $fU): callee OFFLINE -> 480\n");
        sl_send_reply("480", "Temporarily Unavailable");
        exit;
    }

    # dialog state: kamcmd dlg.list shows live calls, dlg.stats_active counts them
    dlg_manage();

    # Every registered contact of the number is a branch; branch_route[MANAGE_BRANCH]
    # anchors the media of each on the relay. The first 200 OK wins, tm cancels
    # the rest.
    xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $rU (From-user $fU): callee ONLINE, ringing $branch(count) + 1 device(s)\n");
    $var(mode) = "relay";
    route(CALL_STARTED);
    route(RELAY);
    exit;
}


#!ifdef TVX_PUSH_WAIT
# App client called: park the INVITE for the wake window, ring the caller, wake
# the phones through the server. Devices that register meanwhile are rung by
# route[RESUME_PARKED] -> route[RESUME].
route[PARK_AND_PUSH] {
    xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $rU (From-user $fU): app client, parking for TVX_WAKE_WINDOW s + push\n");
    $avp(parked) = 1;
    $avp(parked_at) = $TS;
    dlg_manage();

    # The blind branch tm adds on suspend inherits these timers: when no device
    # registered by the end of the window, its timeout brings the call into
    # failure_route[MANAGE_FAILURE], which closes the window with 480. Devices
    # rung later inherit them too - an unanswered phone ends with the window.
    t_set_fr(TVX_WAKE_WINDOW_MS, TVX_WAKE_WINDOW_MS);
    if (!route(HOLD)) {
        sl_reply_error();
        exit;
    }
    t_reply("180", "Ringing");         # keep the caller ringing while the phones wake up
    $var(mode) = "wake";
    route(CALL_STARTED);
    route(PUSH);                       # ask the server to wake the callee's phones
    exit;
}


# Park (or park again) the current INVITE transaction: suspend it and remember
# where it is, so a REGISTER of the callee can resume it. tm keeps a suspended
# transaction alive with a blind branch whose timer is the transaction's
# fr_timer (set to the window by the callers of this route).
route[HOLD] {
    if (!t_suspend()) {
        # Data-loss point: the caller gets an error reply instead of ringing;
        # tm refuses when the transaction is cancelled or already answered.
        xlog("L_ERR", "[TVX] could not park the call $avp(caller) -> $avp(callee)\n");
        return -1;
    }
    $sht(tvxpark=>$avp(callee)) = "" + $T(id_index) + ":" + $T(id_label);
    return 1;
}


# A new device of a number registered: resume the call parked for the number.
# Runs in the REGISTER's request route; t_continue switches to the parked
# INVITE, executes route[RESUME] on it and comes back here.
route[RESUME_PARKED] {
    $var(park) = $sht(tvxpark=>$tU);
    if ($var(park) == $null) {
        return;
    }
    $var(tindex) = $(var(park){s.select,0,:}{s.int});
    $var(tlabel) = $(var(park){s.select,1,:}{s.int});
    # cleared here; route[HOLD] stores it again should the call have to wait on
    $sht(tvxpark=>$tU) = $null;
    xlog("L_INFO", "[TVX] device of $tU came up ($ct from $si:$sp): resuming the parked call $var(tindex):$var(tlabel)\n");
    if (!t_continue("$var(tindex)", "$var(tlabel)", "RESUME")) {
        # the parked INVITE is gone - cancelled or timed out between the lookup above and now
        xlog("L_WARN", "[TVX] parked call $var(tindex):$var(tlabel) for $tU is gone, nothing to resume\n");
    }
}


# Executed by t_continue on the parked INVITE (tm runs it as a failure_route):
# ring every contact the callee has now. The blind branch of the suspend is
# closed by tm; lookup + t_relay add the real branches. A suspend inside this
# route is honoured by tm ("suspended again, not continuing"), so when there is
# nothing to ring the call simply waits on.
route[RESUME] {
    t_on_branch("MANAGE_BRANCH");
    t_on_reply("MANAGE_REPLY");
    t_on_failure("MANAGE_FAILURE");
    if (!lookup("location", "sip:$avp(callee)@$td")) {
        # the registration that resumed us is not in location (raced away or an
        # unregister with a new Call-ID): keep waiting for the next device
        xlog("L_WARN", "[TVX] resumed call $avp(caller) -> $avp(callee): no contact to ring, parking again\n");
        route(HOLD);
        exit;
    }
    xlog("L_INFO", "[TVX] resumed call $avp(caller) -> $avp(callee): ringing $branch(count) + 1 device(s)\n");
    if (!t_relay()) {
        # no branch left the host (every destination refused at once): the
        # window is still open, so wait for the next registration
        xlog("L_WARN", "[TVX] resumed call $avp(caller) -> $avp(callee): relay failed rc=$rc, parking again\n");
        route(HOLD);
    }
    exit;
}


# Ask the provisioning server to wake the callee's phones.
#
# The server (same host, loopback) turns the two numbers into the operator's own
# identifiers, makes up the call id, answers at once and delivers the push to the
# operator's backend asynchronously - the gateway URL, the auth header and the
# delivery log live on the console's Integration page. http_client_request is
# synchronous, but it waits for a loopback answer that comes before any network
# work, so a slow operator backend never ties up a SIP worker.
route[PUSH] {
    # The server only needs the numbers: caller as identified by its registration
    # (route[INVITE] refuses INVITEs from unregistered sources), callee from the R-URI.
    $var(body) = "{\"sip_call_id\":\"" + $ci + "\",\"caller_number\":\"" + $avp(caller) + "\",\"callee_number\":\"" + $avp(callee) + "\"}";
    $var(hdrs) = "X-CORE-TOKEN: TVX_CORE_TOKEN\r\nContent-Type: application/json\r\n";

    xlog("L_INFO", "[TVX] wake request -> callee=$avp(callee) caller=$avp(caller) url=TVX_SERVER_URL/internal/push/wake\n");

    if (http_client_request("POST", "TVX_SERVER_URL/internal/push/wake", "$var(body)", "$var(hdrs)", "$var(push_resp)")) {
        # resp carries the call_id the push will carry and accepted=false with a
        # reason when nothing is on its way (push switched off, queue full).
        xlog("L_INFO", "[TVX] wake accepted: callee=$avp(callee) resp=$var(push_resp)\n");
    } else {
        # Data-loss point: the server is down or refused the token -> the phones
        # may never wake and the caller rings until the window closes.
        xlog("L_WARN", "[TVX] wake request FAILED: callee=$avp(callee) - phones may not wake\n");
    }
}
#!endif


# In-dialog requests: route by the Route set, manage media on every SDP change
# and on teardown. Everything else inside the dialog is relayed untouched.
route[WITHINDLG] {
    if (loose_route()) {
        # decode the alias (if any) so NATed in-dialog requests reach the real UA
        handle_ruri_alias();

        if (is_method("BYE")) {
            xlog("L_INFO", "[TVX] BYE $fU -> $rU from $si:$sp: releasing media\n");
            route(MEDIA_RELEASE);
            $var(reason) = "bye";
            $var(code) = 200;
            route(CALL_ENDED);
        } else if (is_method("ACK")) {
            # ACK to 2xx. Carries SDP only in the late-offer case (INVITE had no
            # SDP, the 200 OK was the offer) - then this is the answer.
            rtpengine_manage(TVX_RTP_FLAGS);
        } else if (is_method("INVITE")) {
            # re-INVITE: hold / resume / codec or video change -> new offer
            xlog("L_INFO", "[TVX] re-INVITE $fU -> $rU from $si:$sp\n");
            rtpengine_manage(TVX_RTP_FLAGS);
        } else if (is_method("UPDATE") && has_body("application/sdp")) {
            # early-media update before the final answer
            rtpengine_offer(TVX_RTP_FLAGS);
        } else if (is_method("INFO")) {
            # SIP INFO DTMF (intercoms open the door this way) - passed through as is;
            # RFC2833 DTMF travels inside RTP through rtpengine and needs nothing here
            xlog("L_INFO", "[TVX] INFO in dialog $fU -> $rU (DTMF/door?) relayed\n");
        }

        route(RELAY);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) {
            # ACK to a locally generated non-2xx reply -> absorbed by tm
            route(RELAY);
            exit;
        }
        # stray ACK with no matching transaction -> ignore
        exit;
    }

    # A request with a To-tag but no Route set pointing at us: the UA lost the
    # route set or the dialog never went through us. Nothing to do.
    xlog("L_WARN", "[TVX] in-dialog $rm without route set from $si:$sp -> 404\n");
    sl_send_reply("404", "Not Here");
    exit;
}


# Relay with the branch/reply/failure routes attached.
route[RELAY] {
    if (is_method("INVITE|UPDATE")) {
        if (!t_is_set("onreply_route")) t_on_reply("MANAGE_REPLY");
    }
    if (is_method("INVITE") && !has_totag()) {
        if (!t_is_set("branch_route")) t_on_branch("MANAGE_BRANCH");
        if (!t_is_set("failure_route")) t_on_failure("MANAGE_FAILURE");
    }
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}


# Drop the rtpengine session of the call, if the call ever had one.
route[MEDIA_RELEASE] {
    if ($sht(tvxmedia=>$ci) != $null) {
        $sht(tvxmedia=>$ci) = $null;
        rtpengine_delete();            # no via-branch, no to-tag: the whole call, every branch
    }
}


####### Call events for the provisioning server (call log, dashboard) #######
# Three facts per call, keyed by the SIP Call-ID: started (who calls whom, relay
# or wake), answered, ended (how). Fire-and-forget over loopback: a lost event
# costs a line in the call log, never the call.

# (the trailing "return" keeps each route non-empty without the server link -
# the cfg grammar has no empty route block)
route[CALL_STARTED] {
#!ifdef TVX_SERVER_LINK
    $var(ev_body) = "{\"event\":\"started\",\"sip_call_id\":\"" + $ci + "\",\"caller_number\":\"" + $avp(caller) + "\",\"callee_number\":\"" + $avp(callee) + "\",\"mode\":\"" + $var(mode) + "\"}";
    route(CALL_EVENT);
#!endif
    return;
}

route[CALL_ANSWERED] {
#!ifdef TVX_SERVER_LINK
    $var(ev_body) = "{\"event\":\"answered\",\"sip_call_id\":\"" + $ci + "\"}";
    route(CALL_EVENT);
#!endif
    return;
}

# $var(reason): bye | cancel | final | window; $var(code): the final SIP code
route[CALL_ENDED] {
#!ifdef TVX_SERVER_LINK
    $var(ev_body) = "{\"event\":\"ended\",\"sip_call_id\":\"" + $ci + "\",\"reason\":\"" + $var(reason) + "\",\"code\":" + $var(code) + "}";
    route(CALL_EVENT);
#!endif
    return;
}

#!ifdef TVX_SERVER_LINK
route[CALL_EVENT] {
    $var(ev_hdrs) = "X-CORE-TOKEN: TVX_CORE_TOKEN\r\nContent-Type: application/json\r\n";
    if (!http_client_request("POST", "TVX_SERVER_URL/internal/call-events", "$var(ev_body)", "$var(ev_hdrs)", "$var(ev_resp)")) {
        # the server is down or refused the token: the call goes on, the log misses a line
        xlog("L_WARN", "[TVX] call event not delivered to the server: $var(ev_body)\n");
    }
}
#!endif


# Branch handler: one rtpengine session per outgoing branch of the initial
# INVITE, so every rung device gets its own media leg and the winner's answer
# is kept apart from the losers' early media.
branch_route[MANAGE_BRANCH] {
    if (has_totag()) {
        return;                        # a re-INVITE was offered in route[WITHINDLG]
    }
    if (!rtpengine_offer(TVX_RTP_BRANCH_FLAGS)) {
        # Data-loss point: this device gets no media leg, so its branch is dropped;
        # the other devices still ring. Usually an SDP the relay refuses - capture
        # the INVITE and check the rtpengine log.
        xlog("L_ERR", "[TVX] rtpengine offer FAILED for branch $ru ($avp(caller) -> $avp(callee)) - branch dropped\n");
        drop;
    }
    $sht(tvxmedia=>$ci) = 1;
    xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $avp(callee): ringing $ru via $du\n");
}


# Reply handler: feed SDP answers to the relay (per branch for the initial
# INVITE), alias NATed contacts, log outcomes.
onreply_route[MANAGE_REPLY] {
    if ($rm == "INVITE") {
        # 18x early media or 2xx answer carrying SDP -> relay answer side of this
        # branch. (rtpengine_manage also handles the late-offer case: a 200 OK
        # with SDP to an INVITE without SDP becomes the offer.)
        if ($rs >= 180 && $rs < 300 && has_body("application/sdp")) {
            if ($avp(initial) == 1) {
                rtpengine_manage(TVX_RTP_BRANCH_FLAGS);
            } else {
                rtpengine_manage(TVX_RTP_FLAGS);
            }
        }
        if ($rs >= 200 && $avp(initial) == 1) {
            # $rU is empty in replies, To-user names the callee; the AVPs are transaction-persistent
            xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $tU: device $si:$sp answered $rs $rr\n");
            if ($rs < 300) {
                route(CALL_ANSWERED);
            }
        }
    } else if ($rm == "UPDATE") {
        if ($rs >= 200 && $rs < 300 && has_body("application/sdp")) {
            rtpengine_answer(TVX_RTP_FLAGS);
        }
    }

    # If the replying UA is NATed, alias its Contact so the other party's
    # in-dialog requests reach it.
    if (nat_uac_test("1")) {
        set_contact_alias();
    }
}


# Failure handler: runs when every branch of the INVITE has a final reply
# (3xx-6xx, tm timeouts, the blind branch of a parked call). Keeps the wake
# window open for parked calls, releases media when the call is really over.
failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        # media was released in the CANCEL branch of request_route
        exit;
    }
    if (has_totag()) {
        # a rejected re-INVITE: the call itself goes on with the previous media
        xlog("L_WARN", "[TVX] re-INVITE $fU -> $rU rejected code=$T_reply_code - media kept\n");
        exit;
    }

#!ifdef TVX_PUSH_WAIT
    if ($avp(parked) == 1) {
        # Every branch is gone: a device declined (603 from the first iOS stack,
        # a family member pressing "decline"), a dead branch failed, or the blind
        # branch of the suspend timed out. None of it ends the call while the
        # window is open: the phones that have not registered yet are still
        # coming. Park again with the rest of the window as the timer.
        $var(elapsed) = $TS - $avp(parked_at);
        if ($var(elapsed) < TVX_WAKE_WINDOW) {
            $var(remaining) = (TVX_WAKE_WINDOW - $var(elapsed)) * 1000;
            if (t_branch_timeout()) {
                $var(why) = "no answer";
            } else {
                $var(why) = "code " + $T_reply_code;
            }
            xlog("L_INFO", "[TVX] call $avp(caller) -> $avp(callee): branches over ($var(why)) after $var(elapsed) s, window stays open for $var(remaining) ms\n");
            t_set_fr($var(remaining), $var(remaining));
            if (route(HOLD)) {
                exit;
            }
            # could not park again - close the call below instead of hanging
        }
        xlog("L_INFO", "[TVX] call $avp(caller) -> $avp(callee): wake window over after $var(elapsed) s (last code $T_reply_code) -> 480\n");
        $sht(tvxpark=>$avp(callee)) = $null;
        route(MEDIA_RELEASE);
        $var(reason) = "window";
        $var(code) = 480;
        route(CALL_ENDED);
        t_reply("480", "Temporarily Unavailable");
        exit;
    }
#!endif

    xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $avp(callee) FAILED code=$T_reply_code - releasing media\n");
    route(MEDIA_RELEASE);
    $var(reason) = "final";
    $var(code) = $T_reply_code;
    route(CALL_ENDED);
}
