# ThunderVox - SIP core v0.5 (stable calls first, push-wait as a switch)
# =====================================================================
# A thin Kamailio proxy + registrar for physical SIP endpoints (intercoms,
# elevators, gates, SOS points) calling mobile apps. Media is relayed by
# rtpengine; user location is in-memory (no DB).
#
# What this core covers (every branch is logged with a [TVX] line):
#   REGISTER      one contact per AoR (latest registration wins), NAT-safe
#                 (received), keepalive pings for NATed contacts, unregister
#   INVITE        callee online  -> relay through rtpengine (audio + video)
#                 callee offline -> 480 (default) or park + push (TVX_PUSH_WAIT)
#   CANCEL        before answer: cancel the branch, release media, 487 to caller
#   BYE           from either side: release media, relay
#   re-INVITE     hold / resume / codec change: re-offer + re-answer
#   ACK           2xx ACK (plain or late-offer with SDP), negative-reply ACK
#   UPDATE        early-media SDP update
#   INFO/NOTIFY   relayed inside the dialog untouched (SIP INFO DTMF = door open)
#   OPTIONS       answered 200 (device keepalives / availability probes)
#   failures      408/480/486/603/etc. and timeouts release media
#   transport     UDP and TCP on 5060, same public advertise address
#   identity      the calling device is the one registered from the source
#                 socket (ip:port -> AoR, htable), never the From header: intercom
#                 firmwares put the apartment number there. An INVITE from a
#                 source that never registered gets 403.
#   hygiene       scanner User-Agents dropped, optional flood guard (pike),
#                 optional digest auth (TVX_AUTH), retransmissions re-answered
#
# Deliberate v0 limits (see README "Known limitations"):
#   - one contact per AoR => no parallel forking, no per-branch rtpengine
#     sessions (multi-device users are a v1 item: via-branch in branch_route)
#   - push is synchronous (blocks a SIP worker up to 2s) and off by default
#   - no persistence: registrations and dialogs are lost on restart
#
# NAT strategy (proven pattern): "received" for registered devices
# (fix_nated_register + received_avp) and "alias" for the other in-dialog party
# (set_contact_alias / handle_ruri_alias). RTP is always anchored on rtpengine,
# so the two UAs never need a direct path.


####### Site-local values and switches (kept OUT of this repository) #######
# Public IP, push gateway URL, service token and the feature switches are
# deployment-specific and live in local.cfg next to this file (copy
# local.cfg.example). docker-compose mounts the whole configuration/ directory.
# include_file is a preprocessor directive: substdef/define from local.cfg are in
# effect for the whole config below, exactly as if written here.
#   TVX_SIP_DOMAIN  - the DNS name devices register to and dial through. When
#                     set, the core works through it: advertised in Via/
#                     Record-Route and treated as "myself" (decision 2026-10-01).
#   TVX_PUBLIC_IP   - server public IP. Used for advertise when TVX_SIP_DOMAIN is
#                     absent, otherwise only aliased as a fallback for raw-IP
#                     devices. Keep it equal to TVX_PUBLIC_IP in deployment/.env.
#                     At least one of TVX_SIP_DOMAIN / TVX_PUBLIC_IP must be set.
#   TVX_PUSH_URL    - push gateway endpoint (only used with TVX_PUSH_WAIT)
#   TVX_PUSH_TOKEN  - X-SERVICE-TOKEN value (only used with TVX_PUSH_WAIT)
# Switches (#!define NAME in local.cfg to enable, all OFF when absent):
#   TVX_PUSH_WAIT   - park INVITEs for offline callees and wake them by push;
#                     without it an offline callee gets 480 at once
#   TVX_AUTH        - digest authentication for REGISTER and INVITE; credentials
#                     come from users.cfg (copy users.cfg.example)
#   TVX_ANTIFLOOD   - pike request-rate guard per source IP
include_file "/etc/kamailio/local.cfg"

# Fail fast with a readable token in the parser error when local.cfg defines
# neither the SIP domain nor the public IP.
#!ifndef TVX_SIP_DOMAIN
#!ifndef TVX_PUBLIC_IP
NEITHER_TVX_SIP_DOMAIN_NOR_TVX_PUBLIC_IP_IS_DEFINED_IN_LOCAL_CFG
#!endif
#!endif

# rtpengine ng control socket and per-leg media flags: plain RTP/AVP, ICE
# stripped, o= rewritten to the relay. (replace-session-connection was dropped:
# rtpengine 13.x accepts it silently and does nothing.)
#!define TVX_RTPENGINE_SOCK "udp:127.0.0.1:4444"
#!define TVX_RTP_FLAGS "replace-origin ICE=remove"

# Flags. Keep the #!define lines bare: the preprocessor takes the whole rest of
# the line as the value, so a trailing "# comment" gets pasted into every usage.
#   FLT_NATS - transaction flag: this request came from behind NAT
#   FLB_NATB - branch flag: contact is NATed (stored in usrloc, natping target)
#!define FLT_NATS 5
#!define FLB_NATB 6


####### Global Parameters #######

debug=2
log_stderror=yes
# every log line carries message type (1=request, 2=reply), CSeq and Call-ID,
# so one call can be followed through kamailio logs with a single grep
log_prefix="{$mt $hdr(CSeq) $ci} "

memdbg=5
memlog=5

children=4

server_header="Server: ThunderVox"
user_agent_header="User-Agent: ThunderVox"
sip_warning=0

# Bind on all interfaces, advertise one public address so replies/in-dialog
# requests come back to us even behind cloud 1:1 NAT. TCP is offered for
# devices that cannot do UDP; both sockets advertise the same address.
# The SIP domain wins when it is set; otherwise the public IP is advertised.
#!ifdef TVX_SIP_DOMAIN
listen=udp:0.0.0.0:5060 advertise TVX_SIP_DOMAIN:5060
listen=tcp:0.0.0.0:5060 advertise TVX_SIP_DOMAIN:5060
#!else
listen=udp:0.0.0.0:5060 advertise TVX_PUBLIC_IP:5060
listen=tcp:0.0.0.0:5060 advertise TVX_PUBLIC_IP:5060
#!endif
# some embedded stacks omit Content-Length on TCP; accept instead of dropping
tcp_accept_no_cl=yes

# What counts as "us" for uri==myself: the SIP domain when set, the raw public
# IP whenever it is set (fallback for devices that dial by IP).
#!ifdef TVX_SIP_DOMAIN
alias=TVX_SIP_DOMAIN:5060
#!endif
#!ifdef TVX_PUBLIC_IP
alias=TVX_PUBLIC_IP:5060
#!endif


####### Modules #######

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "htable.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "kex.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "dialog.so"
loadmodule "ctl.so"

#!ifdef TVX_PUSH_WAIT
loadmodule "tsilo.so"
loadmodule "http_client.so"
#!endif

#!ifdef TVX_AUTH
loadmodule "auth.so"
#!endif

#!ifdef TVX_ANTIFLOOD
loadmodule "pike.so"
#!endif


####### Module Parameters #######

# --- tm: transaction timers ---
# fr_timer: no reply at all (e.g. NATed contact whose pinhole died) -> 408.
# fr_inv_timer: ringing without final answer -> 408; a parked (push-wait) call
# also ends here if the device never registers. Both in milliseconds.
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

# --- registrar / usrloc: in-memory location ---
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 0)                      # AoR = user part only (sip:101@IP and sip:101@host are the same user)
modparam("usrloc", "nat_bflag", FLB_NATB)                 # NATed contacts get pinged by nathelper
modparam("registrar", "method_filtering", 0)              # never hide a contact because of its Allow header (embedded stacks lie there)
modparam("registrar", "received_avp", "$avp(RECEIVED)")   # remember the real source socket of NATed UAs
modparam("registrar", "default_expires", 600)             # REGISTER without Expires
modparam("registrar", "min_expires", 60)                  # shorter values are raised silently (NAT pinhole is kept by natping anyway)
modparam("registrar", "max_expires", 3600)                # longer values are capped so a dead device disappears within an hour

# --- htable: device identity, source socket -> registered AoR ---
# Written on REGISTER (key "ip:port", value = AoR username), read on INVITE to
# name the calling device. A device whose NAT mapping changed re-registers from
# the new socket and gets a new item; stale items expire with the longest
# allowed registration (max_expires) and a live registration is re-checked on
# every INVITE anyway, so a stale item can never let an unregistered source call.
modparam("htable", "htable", "tvxdev=>size=12;autoexpire=3600;")

# --- nathelper: NAT keepalive + received handling ---
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "natping_interval", 30)             # keep the NAT pinhole open every 30s (4-byte UDP, invisible in sngrep)
modparam("nathelper", "ping_nated_only", 1)

# --- rtpengine: media relay ---
modparam("rtpengine", "rtpengine_sock", TVX_RTPENGINE_SOCK)

# --- dialog: call state for observability only (kamcmd dlg.list / dlg.stats_active) ---
modparam("dialog", "db_mode", 0)
modparam("dialog", "enable_stats", 1)

# --- ctl: kamcmd socket (ul.dump, dlg.list, tm.stats, rtpengine.show all) ---
modparam("ctl", "binrpc", "unix:/tmp/kamailio_ctl")

#!ifdef TVX_PUSH_WAIT
# --- tsilo: park INVITE transactions until the callee registers ---
modparam("tsilo", "use_domain", 0)                        # match parked calls by username only (same rule as usrloc)
# --- http_client: push gateway calls ---
modparam("http_client", "connection_timeout", 2)          # bound the blocking push call (see route[PUSH])
#!endif

#!ifdef TVX_ANTIFLOOD
# --- pike: more than 32 requests per 2s from one IP -> dropped for 4 units ---
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 32)
modparam("pike", "remove_latency", 4)
#!endif


####### Main request routing #######

request_route {

    # sanity, hop limit, scanners, flood
    route(REQINIT);

    # NAT detection (force_rport + contact fixups) for every request
    route(NATDETECT);

    # OPTIONS to the server itself: device keepalive / "is the server alive"
    # probe. Answer 200 - a 405 here makes some UAs mark the server dead.
    if (is_method("OPTIONS") && !has_totag()) {
        sl_send_reply("200", "OK");
        exit;
    }

    # CANCEL: the caller gave up before the answer. Release media, cancel the
    # pending branch (tm answers 487 to the INVITE and 200 to the CANCEL).
    # A parked (push-wait) INVITE is an INVITE transaction too and is handled
    # the same way.
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            xlog("L_INFO", "[TVX] CANCEL $fU -> $rU from $si:$sp: releasing media\n");
            rtpengine_manage();            # CANCEL -> delete the rtpengine session
            t_relay();
        } else {
            sl_send_reply("481", "Call/Transaction Does Not Exist");
        }
        exit;
    }

    # in-dialog (sequential) requests: ACK / BYE / re-INVITE / UPDATE / INFO
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # retransmission of an initial request already in tm -> tm re-sends the
    # last reply and stops here (e.g. INVITE repeated while we ring the callee)
    t_check_trans();

    # initial requests we serve
    if (is_method("REGISTER")) { route(AUTH); route(REGISTER); exit; }
    if (is_method("INVITE"))   { route(AUTH); route(INVITE);   exit; }

    # closed core: no other initial request is accepted (SUBSCRIBE, PUBLISH,
    # MESSAGE, out-of-dialog NOTIFY/INFO/REFER). Logged so nothing dies silently.
    xlog("L_WARN", "[TVX] unsupported initial $rm from $si:$sp ua=$ua -> 405\n");
    sl_send_reply("405", "Method Not Allowed");
    exit;
}


# Request sanity, loop protection, scanner and flood guard.
route[REQINIT] {
    # Known SIP scanners / fraud dialers: drop without any reply (a reply only
    # tells them a SIP server is here).
    if ($ua =~ "friendly-scanner|sipvicious|sipcli|VaxSIPUserAgent|sundayddr|pplsip") {
        xlog("L_WARN", "[TVX] scanner $ua from $si:$sp - dropped\n");
        exit;
    }

#!ifdef TVX_ANTIFLOOD
    # Request-rate guard per source IP. Note: one NAT with many devices behind
    # it counts as one IP - keep reqs_density_per_unit generous.
    if (!pike_check_req()) {
        xlog("L_WARN", "[TVX] flood from $si:$sp - dropped\n");
        exit;
    }
#!endif

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        # Data-loss point for exotic firmwares: a device whose requests fail
        # here never gets a reply. The dropped request should be captured with
        # sngrep and the check relaxed deliberately, not removed.
        xlog("L_WARN", "[TVX] malformed $rm from $si:$sp ua=$ua - dropped by sanity_check\n");
        exit;
    }
}


# Detect NAT and rewrite contacts so we can reach UAs behind NAT.
# Test 19 = 1 (Contact has a private IP) + 2 (Via differs from source IP)
#         + 16 (source port differs from Via port).
route[NATDETECT] {
    force_rport();
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            # rewrite the REGISTER Contact to the real source (kept via received_avp)
            fix_nated_register();
        } else if (is_first_hop()) {
            # encode the real source into an alias so in-dialog requests get back to the UA
            set_contact_alias();
        }
        setflag(FLT_NATS);
    }
}


# Digest authentication for REGISTER (401) and INVITE (407).
# Credentials come from route[AUTH_PASSWORD] in users.cfg: it sets
# $avp(password) for the auth username $au, or leaves it unset for unknown
# users. With TVX_AUTH absent this route is empty and the core is open - fine
# for a closed test, never for anything reachable by strangers.
route[AUTH] {
#!ifdef TVX_AUTH
    route(AUTH_PASSWORD);

    if ($au != $null && $avp(password) == $null) {
        xlog("L_WARN", "[TVX] auth: unknown user $au from $si:$sp -> 403\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    # Flags "0": challenge without qop, the most compatible form for embedded
    # SIP stacks (intercom firmwares).
    if (is_method("REGISTER")) {
        # checks=1: the auth username must equal the To user - a device cannot
        # register as somebody else.
        if (!pv_auth_check("$fd", "$avp(password)", "0", "1")) {
            auth_challenge("$fd", "0");
            exit;
        }
    } else {
        # checks=0: the From user is NOT compared with the auth username. Intercom
        # firmwares put the apartment number into From (Beward: From-user = flat,
        # account = 101), so the caller's identity is the authenticated username
        # itself - route[INVITE] takes it from here.
        if (!pv_auth_check("$fd", "$avp(password)", "0", "0")) {
            auth_challenge("$fd", "0");
            exit;
        }
        $avp(caller) = $au;
    }

    # do not leak the Authorization header to the other party
    consume_credentials();
#!endif
    return;
}


# REGISTER: store the contact (one per AoR), then resume parked calls if any.
route[REGISTER] {
    if (isflagset(FLT_NATS)) {
        setbflag(FLB_NATB);            # mark contact NATed so nathelper keeps its pinhole alive
    }

    # 0x04 = one contact per AoR: a new registration replaces the previous one.
    # Deterministic for a prototype (the last device to register gets the call)
    # and keeps rtpengine at one session per call - no parallel forking.
    if (!save("location", "0x04")) {
        xlog("L_WARN", "[TVX] REGISTER failed: aor=$tu src=$si:$sp rc=$rc\n");
        sl_reply_error();
        exit;
    }

    $var(dev) = $si + ":" + $sp;

    if ($rc == 3) {
        $sht(tvxdev=>$var(dev)) = $null;   # device left: drop its identity binding
        xlog("L_INFO", "[TVX] UNREGISTER ok: aor=$tu src=$si:$sp\n");
        exit;
    }

    # Identity binding for route[INVITE]: a device calls from the socket it
    # registers from (one SIP stack, one socket), so "ip:port" names the device.
    $sht(tvxdev=>$var(dev)) = $tU;

    if (isflagset(FLT_NATS)) { $var(nat) = "nat"; } else { $var(nat) = "direct"; }
    xlog("L_INFO", "[TVX] REGISTER ok: aor=$tu contact=$ct expires=$hdr(Expires) src=$si:$sp proto=$pr $var(nat) ua=$ua\n");

#!ifdef TVX_PUSH_WAIT
    # The device just came online. If an endpoint called it while it slept,
    # tsilo appends the fresh contact as a branch and routes the parked INVITE.
    ts_append("location", "$tu");
#!endif
    exit;
}


# INVITE: find the callee, anchor media, relay (online) or 480 / park + push (offline).
route[INVITE] {
    # Record-Route so in-dialog ACK/BYE/re-INVITE traverse us (NAT + media teardown).
    record_route();

    # Attach reply/failure handling BEFORE any transaction is created - so a
    # parked transaction also runs these routes when tsilo later resumes it.
    t_on_reply("MANAGE_REPLY");
    t_on_failure("MANAGE_FAILURE");

    # Who is calling: the device bound to the source socket on REGISTER (with
    # TVX_AUTH route[AUTH] has already set the authenticated username). The From
    # header is never an identity - intercom firmwares put the apartment number
    # there (Beward: From-user = flat number while the account is 101) - so it
    # is only logged. A source that never registered is not a device of ours:
    # 403, which also ends the fraud probes that reach an open core.
    if ($avp(caller) == $null) {
        $var(dev) = $si + ":" + $sp;
        $avp(caller) = $sht(tvxdev=>$var(dev));
    }
    if ($avp(caller) == $null || !registered("location", "sip:$avp(caller)@$fd")) {
        xlog("L_WARN", "[TVX] INVITE from unregistered source $si:$sp (From-user $fU, ua=$ua) -> $rU: 403\n");
        sl_send_reply("403", "Caller Not Registered");
        exit;
    }

    # Users are matched by username only (usrloc use_domain=0), so a foreign
    # R-URI domain is never forwarded anywhere - it is just logged here. With
    # the domain and/or the IP aliased, this fires only for a misconfigured
    # device (wrong domain field) - the log line names it.
    if (!(uri==myself)) {
        xlog("L_WARN", "[TVX] INVITE to foreign domain $rd from $si:$sp ua=$ua - device domain field is wrong, looked up as local user $rU\n");
    }

    if (!lookup("location")) {
        # Callee not registered (or lookup error: rc -3).
        if ($rc == -3) {
            xlog("L_ERR", "[TVX] INVITE $avp(caller) -> $rU: lookup internal error\n");
            sl_send_reply("500", "Server Error");
            exit;
        }
#!ifdef TVX_PUSH_WAIT
        route(PARK_AND_PUSH);
#!else
        xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $rU (From-user $fU): callee OFFLINE, push-wait disabled -> 480\n");
        sl_send_reply("480", "Temporarily Unavailable");
#!endif
        exit;
    }

    # dialog state: kamcmd dlg.list shows live calls, dlg.stats_active counts them
    dlg_manage();

    # Callee registered -> media offer: rewrite SDP so RTP is anchored on the
    # relay (symmetric, NAT-safe), then relay to the registered contact.
    if (!rtpengine_manage(TVX_RTP_FLAGS)) {
        # Data-loss point: no media session means no call. Usually an SDP the
        # relay refuses - capture the INVITE and check the rtpengine log.
        xlog("L_ERR", "[TVX] rtpengine offer FAILED for INVITE $avp(caller) -> $rU from $si:$sp\n");
        sl_send_reply("500", "Media Error");
        exit;
    }
    xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $rU (From-user $fU): callee ONLINE, relaying to $du\n");
    route(RELAY);
    exit;
}


#!ifdef TVX_PUSH_WAIT
# Callee offline: anchor media, park the transaction, ring the caller, wake the device.
route[PARK_AND_PUSH] {
    # The offer must happen before the transaction is created so the parked
    # INVITE already carries the relay SDP when tsilo resumes it.
    if (!rtpengine_manage(TVX_RTP_FLAGS)) {
        xlog("L_ERR", "[TVX] rtpengine offer FAILED for parked INVITE $avp(caller) -> $rU\n");
        sl_send_reply("500", "Media Error");
        exit;
    }
    xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $rU (From-user $fU): callee OFFLINE, parking + push\n");
    dlg_manage();
    if (!t_newtran()) {
        rtpengine_delete();
        sl_reply_error();
        exit;
    }
    ts_store();                        # park this transaction, keyed by R-URI (the callee AoR)
    t_reply("180", "Ringing");         # keep the caller ringing while the device wakes up
    route(PUSH);                       # fire the push to wake the callee's device
    # If the device never registers, fr_inv_timer ends the call with 408 and
    # failure_route releases the media.
    exit;
}


# Wake the callee device via the push gateway.
#
# POINT OF FAILURE (read this): http_client_request is SYNCHRONOUS - it blocks this
# SIP worker until the gateway answers or connection_timeout (2s) elapses. A hung
# gateway therefore ties up one worker. For production, move push delivery to an
# async gateway microservice and fire-and-forget here (target architecture §2А).
route[PUSH] {
    # tv-sip backend contract: call_id correlates all further actions on this call,
    # caller_id is the calling device id (its source ip:port - the same value the
    # mobile backend uses as intercom device_id), callee_id is the client to wake.
    $var(body) = "{\"call_id\":\"" + $ci + "\",\"caller_id\":\"" + $si + ":" + $sp + "\",\"callee_id\":\"" + $rU + "\"}";
    $var(hdrs) = "X-SERVICE-TOKEN: TVX_PUSH_TOKEN\r\nContent-Type: application/json\r\n";

    xlog("L_INFO", "[TVX] push wake -> callee=$rU caller=$si:$sp url=TVX_PUSH_URL\n");

    if (http_client_request("POST", "TVX_PUSH_URL", "$var(body)", "$var(hdrs)", "$var(push_resp)")) {
        # The test backend echoes the parsed fields back - field-mapping mistakes
        # are visible right here in resp.
        xlog("L_INFO", "[TVX] push accepted: callee=$rU resp=$var(push_resp)\n");
    } else {
        # Data-loss point: device may never wake -> caller rings until fr_inv_timer.
        xlog("L_WARN", "[TVX] push FAILED: callee=$rU - device may not wake\n");
    }
}
#!endif


# In-dialog requests: route by the Route set, manage media on every SDP change
# and on teardown. Everything else inside the dialog is relayed untouched.
route[WITHINDLG] {
    if (loose_route()) {
        # decode the alias (if any) so NATed in-dialog requests reach the real UA
        handle_ruri_alias();

        if (is_method("BYE")) {
            xlog("L_INFO", "[TVX] BYE $fU -> $rU from $si:$sp: releasing media\n");
            rtpengine_manage();                 # BYE -> delete the rtpengine session
        } else if (is_method("ACK")) {
            # ACK to 2xx. Carries SDP only in the late-offer case (INVITE had no
            # SDP, the 200 OK was the offer) - then this is the answer.
            rtpengine_manage(TVX_RTP_FLAGS);
        } else if (is_method("INVITE")) {
            # re-INVITE: hold / resume / codec or video change -> new offer
            xlog("L_INFO", "[TVX] re-INVITE $fU -> $rU from $si:$sp\n");
            rtpengine_manage(TVX_RTP_FLAGS);
        } else if (is_method("UPDATE") && has_body("application/sdp")) {
            # early-media update before the final answer
            rtpengine_offer(TVX_RTP_FLAGS);
        } else if (is_method("INFO")) {
            # SIP INFO DTMF (intercoms open the door this way) - passed through as is;
            # RFC2833 DTMF travels inside RTP through rtpengine and needs nothing here
            xlog("L_INFO", "[TVX] INFO in dialog $fU -> $rU (DTMF/door?) relayed\n");
        }

        route(RELAY);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) {
            # ACK to a locally generated non-2xx reply -> absorbed by tm
            route(RELAY);
            exit;
        }
        # stray ACK with no matching transaction -> ignore
        exit;
    }

    # A request with a To-tag but no Route set pointing at us: the UA lost the
    # route set or the dialog never went through us. Nothing to do.
    xlog("L_WARN", "[TVX] in-dialog $rm without route set from $si:$sp -> 404\n");
    sl_send_reply("404", "Not Here");
    exit;
}


# Relay with the correct reply/failure routes attached.
route[RELAY] {
    if (is_method("INVITE|UPDATE")) {
        if (!t_is_set("onreply_route")) t_on_reply("MANAGE_REPLY");
    }
    if (is_method("INVITE") && !has_totag()) {
        if (!t_is_set("failure_route")) t_on_failure("MANAGE_FAILURE");
    }
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}


# Reply handler: feed SDP answers to the relay, alias NATed contacts, log outcomes.
onreply_route[MANAGE_REPLY] {
    if ($rm == "INVITE") {
        # 18x early media or 2xx answer carrying SDP -> relay answer side.
        # (rtpengine_manage also handles the late-offer case: a 200 OK with SDP
        # to an INVITE without SDP becomes the offer.)
        if ($rs >= 180 && $rs < 300 && has_body("application/sdp")) {
            rtpengine_manage(TVX_RTP_FLAGS);
        }
        if ($rs >= 200) {
            xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $tU answered $rs $rr from $si:$sp\n");   # $rU is empty in replies, To-user names the callee; $avp(caller) is transaction-persistent
        }
    } else if ($rm == "UPDATE") {
        if ($rs >= 200 && $rs < 300 && has_body("application/sdp")) {
            rtpengine_answer(TVX_RTP_FLAGS);
        }
    }

    # If the replying UA is NATed, alias its Contact so the other party's
    # in-dialog requests reach it.
    if (nat_uac_test("1")) {
        set_contact_alias();
    }
}


# Failure handler: release media when the call could not be completed.
# Runs for 3xx-6xx final replies and for tm timeouts (408).
failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        # media was released in the CANCEL branch of request_route
        exit;
    }
    if (has_totag()) {
        # a rejected re-INVITE: the call itself goes on with the previous media
        xlog("L_WARN", "[TVX] re-INVITE $fU -> $rU rejected code=$T_reply_code - media kept\n");
        exit;
    }
    xlog("L_INFO", "[TVX] INVITE $avp(caller) -> $rU FAILED code=$T_reply_code - releasing media\n");
    rtpengine_manage();                # failure_route -> delete the rtpengine session
}


####### Optional credentials (only read with TVX_AUTH) #######
# users.cfg defines route[AUTH_PASSWORD] (copy users.cfg.example). import_file
# is silent when the file is missing; with TVX_AUTH set and no users.cfg the
# config fails to load with "route AUTH_PASSWORD not found" - on purpose.
import_file "/etc/kamailio/users.cfg"
