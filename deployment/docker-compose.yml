# ThunderVox - SIP core deployment (core only, single host, own images)
# =====================================================================
# Two host-networked containers from the images this repository builds:
#   - core:       SIP signaling + registrar + push-wait routing (Kamailio, config inside the image)
#   - rtpengine:  media (RTP/RTCP) relay + NAT traversal, UDP ports 29000-30000
#
# Image tags are pinned to the repository release that was tested together; "latest" does not exist.
# Updating = change the tag -> docker compose pull && docker compose up -d. No sources, no builds on the host.
#
# Host networking is required so rtpengine uses the host's public IP directly and opens the RTP port range
# without Docker port-mapping overhead. Linux only.
#
# Site-local values are NOT in this repository: the host address comes from .env (copy .env.example), the
# kamailio values and switches from configuration/local.cfg (copy local.cfg.example). kamailio.cfg itself
# lives in the image. TVX_PUBLIC_IP in .env and TVX_PUBLIC_IP in local.cfg MUST be the same real public IP -
# one feeds rtpengine, the other SIP.
#
# Firewall: open UDP+TCP 5060 (SIP) and UDP 29000-30000 (RTP) to the internet.
#
# Config check before (re)starting the core - fails fast on a typo in local.cfg:
#   docker compose run --rm core -c -f /etc/kamailio/kamailio.cfg
#
# The full system (core, rtpengine, postgres, server, web) is composed in the umbrella repository
# github.com/beiroun/thundervox; this file runs the core alone, e.g. for bare tests without provisioning.

services:
  core:
    image: ghcr.io/beiroun/thundervox-core:0.6.1
    container_name: thundervox-core
    network_mode: host
    volumes:
      # Only the site-local file is mounted; kamailio.cfg is part of the image. A missing local.cfg fails
      # the start on purpose (include_file) instead of running with somebody else's defaults.
      - ./configuration/local.cfg:/etc/kamailio/local.cfg:ro
    environment:
      TZ: "Asia/Omsk"
    depends_on:
      - rtpengine            # ordering only; the core retries the ng socket at runtime
    restart: always

  rtpengine:
    image: ghcr.io/beiroun/thundervox-rtpengine:0.6.1
    container_name: thundervox-rtpengine
    network_mode: host
    environment:
      # fails fast if .env is missing instead of advertising media on a bogus address
      TVX_PUBLIC_IP: "${TVX_PUBLIC_IP:?set TVX_PUBLIC_IP in deployment/.env}"
      # TVX_LOCAL_IP: "10.0.0.5"             # only when the host's interface address differs from the public one (1:1 NAT)
      TVX_RTP_NG_PORT: "4444"                 # ng control port on 127.0.0.1; the core's TVX_RTPENGINE_SOCK points here
      TVX_RTP_PORT_MIN: "29000"               # narrow test pool (~250 concurrent calls); widen for production
      TVX_RTP_PORT_MAX: "30000"
      TVX_RTP_LOG_LEVEL: "6"                  # 6=info; 7 for verbose media debug
      TZ: "Asia/Omsk"
    restart: always
