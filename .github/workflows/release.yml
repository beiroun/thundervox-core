# SPDX-License-Identifier: BUSL-1.1
# Tag vX.Y.Z -> ghcr.io/beiroun/thundervox-core:X.Y.Z and ghcr.io/beiroun/thundervox-rtpengine:X.Y.Z.
# The two images share the repository's version: the core config and the media relay it was tested with ship
# together. "latest" is never published; the deployment compose pins exact versions.
# The core image is config-checked before it is pushed, with the same fixtures as ci.yml (TVX_TLS needs a
# certificate pair to load). rtpengine waits for the core job, so a failed check never publishes half a release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # buildx and the BuildKit daemon pinned like everything else (2026-10-22): the action's default is the latest
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/beiroun/thundervox-core
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.licenses=BUSL-1.1
            org.opencontainers.image.title=ThunderVox Core
      - name: Build (local) for the config check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: thundervox-core:release-check
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
      - name: Prepare config fixtures
        run: |
          cp ci/fixture.cfg ci/local.cfg
          # every switch on: the ##!define lines of the fixture become #!define
          sed 's/^##!define /#!define /' ci/fixture.cfg > ci/local-all-switches.cfg
          # TVX_TLS needs a readable certificate pair; a throwaway self-signed one proves the config loads.
          # World-readable on purpose: the container runs as uid 1001, which is not the runner's user.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=sip.example.com' \
            -keyout ci/tls.key -out ci/tls.crt
          chmod 644 ci/tls.key ci/tls.crt
          printf '%s\n' \
            '[server:default]' \
            'method = TLSv1.2+' \
            'certificate = /etc/kamailio/ci-tls.crt' \
            'private_key = /etc/kamailio/ci-tls.key' \
            'verify_certificate = no' \
            'require_certificate = no' > ci/tls.cfg
      - name: Config check before publishing
        run: |
          docker run --rm \
            -v "$PWD/ci/local.cfg:/etc/kamailio/local.cfg:ro" \
            thundervox-core:release-check -c -f /etc/kamailio/kamailio.cfg
          docker run --rm \
            -v "$PWD/ci/local-all-switches.cfg:/etc/kamailio/local.cfg:ro" \
            -v "$PWD/ci/tls.cfg:/etc/kamailio/tls.cfg:ro" \
            -v "$PWD/ci/tls.crt:/etc/kamailio/ci-tls.crt:ro" \
            -v "$PWD/ci/tls.key:/etc/kamailio/ci-tls.key:ro" \
            thundervox-core:release-check -c -f /etc/kamailio/kamailio.cfg
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=core

  rtpengine:
    needs: core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # buildx and the BuildKit daemon pinned like everything else (2026-10-22): the action's default is the latest
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/beiroun/thundervox-rtpengine
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.licenses=BUSL-1.1
            org.opencontainers.image.title=ThunderVox rtpengine
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: rtpengine/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rtpengine
          cache-to: type=gha,mode=max,scope=rtpengine
